# Aplicado automaticamente em desenvolvimento. Em produção, use só o compose.yaml:
#   docker compose -f compose.yaml up -d
#
# Expõe o banco, o Redis e a API só para a própria máquina (127.0.0.1), para rodar os testes e o Vite fora do
# contêiner. Nunca para a rede.
services:
  db:
    ports:
      - "127.0.0.1:5433:5432"

  redis:
    ports:
      - "127.0.0.1:6380:6379"

  api:
    ports:
      - "127.0.0.1:8000:8000"
