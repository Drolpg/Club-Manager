# Sobe o sistema inteiro: `docker compose up --build`.
# Em desenvolvimento, o compose.override.yaml é aplicado sozinho por cima deste arquivo.
name: club-manager

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clubmanager}
      POSTGRES_USER: ${POSTGRES_USER:-clubmanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    # Configuração enxuta para caber na instância única (RNF-02).
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30", "-c", "work_mem=4MB"]
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--maxmemory", "48mb", "--maxmemory-policy", "noeviction", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    image: club-manager-api:${IMAGE_TAG:-dev}
    environment: &backend-env
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?defina DJANGO_SECRET_KEY no .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      SITE_URL: ${SITE_URL:-http://localhost:8080}
      EMAIL_URL: ${EMAIL_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Club Manager <nao-responda@localhost>}
      DATABASE_URL: postgres://${POSTGRES_USER:-clubmanager}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-clubmanager}
      REDIS_URL: redis://redis:6379/0
    command:
      - sh
      - -c
      - python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --access-logfile -
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/')"]
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    image: club-manager-api:${IMAGE_TAG:-dev}
    environment: *backend-env
    # Um worker com o agendador embutido (-B), para poupar um processo (ADR-006).
    command: ["celery", "-A", "config", "worker", "-B", "--concurrency", "1", "--loglevel", "info", "--schedule", "/tmp/celerybeat-schedule"]
    depends_on:
      api:
        condition: service_healthy

  web:
    build: ./frontend
    image: club-manager-web:${IMAGE_TAG:-dev}
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
